proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
# Forward only the headers the application needs, rather than arbitrary
# client-supplied forwarding or idempotency headers.
proxy_pass_request_headers off;
proxy_set_header Origin $http_origin;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Host $host;
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Client-Cert "";
proxy_set_header Idempotency-Key "";
proxy_set_header X-Idempotency-Key "";
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_next_upstream off;
