# Standalone example. Replace the domain and certificate paths before use.
worker_processes auto;
error_log /dev/null crit;
pid /tmp/s4cred-nginx.pid;

events { worker_connections 1024; }

http {
    access_log off;
    limit_req_zone $binary_remote_addr zone=create:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=consume:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=connections:10m;

    server {
        listen 127.0.0.1:443 ssl;
        server_name notes.example.com;
        ssl_certificate /etc/s4cred/tls/fullchain.pem;
        ssl_certificate_key /etc/s4cred/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 1400000;
        client_body_buffer_size 1400000;
        client_header_timeout 10s;
        client_body_timeout 15s;
        send_timeout 30s;
        limit_conn connections 20;
        limit_conn_status 429;
        limit_req_status 429;

        location = /api/notes {
            limit_req zone=create burst=10 nodelay;
            include /etc/s4cred/nginx-proxy.conf;
        }
        location ^~ /api/notes/ {
            limit_req zone=consume burst=60 nodelay;
            include /etc/s4cred/nginx-proxy.conf;
        }
        location / {
            include /etc/s4cred/nginx-proxy.conf;
        }
    }
}
